name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: pnpm run validate

    - name: Build assets
      run: pnpm run build

    - name: Verify distribution
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist directory not created"
          exit 1
        fi

        # Check that expected platforms exist
        for platform in web ios android; do
          if [ ! -d "dist/$platform" ]; then
            echo "Error: Platform $platform not found in dist"
            exit 1
          fi
        done

        echo "✅ Distribution verification passed"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chassis-assets-${{ matrix.node-version }}
        path: dist/
        retention-days: 7
