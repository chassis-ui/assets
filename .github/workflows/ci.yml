name: CI

# workflow_call lets a release workflow run it first.
on:
  push:
    # A commit reaches `staging`, `main` and `app/docs` only after these checks passed on
    # it, so they run on `develop` first, as in chassis-website. Their results belong to the
    # commit, and the ruleset reads them there, so pushing the same commit to the other
    # branches does not run them again.
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, the build scripts and their types, the site's code and its types. Needs no
  # Git LFS files.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint build scripts
        run: pnpm assets:lint

      - name: Type-check build scripts
        run: pnpm assets:typecheck

      - name: Lint site
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

  # The tests, the lint of source/, and a build of every brand, app and platform that is
  # checked against the consumer contract
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fonts and images are Git LFS files. The objects are cached by the list of their ids,
      # so a run downloads only what changed, which keeps the LFS bandwidth quota low.
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint source
        run: pnpm assets:lint:source

      # Builds every job into a scratch folder, and fails when the docs output lacks a file
      # that the sites read
      - name: Verify the build
        run: pnpm assets:verify

  # The same build as Vercel: the docs assets, then Astro and Pagefind
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      - name: Audit dependencies
        run: pnpm check:pnpm
