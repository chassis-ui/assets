name: CI

# On a push and on a pull request: the source lint, the build and the verification of its
# output, with the commands of @chassis-ui/assets. Written by `chassis-assets init`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fonts and images are Git LFS files
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      # __PNPM_SETUP__
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: __INSTALL_CI__

      - name: Lint source
        run: __RUN__ lint

      - name: Build
        run: __RUN__ build

      - name: Verify
        run: __RUN__ verify
