name: CI

# release.yml reads the results of these jobs on the commit it releases, by their names.
on:
  push:
    # A commit reaches `staging` and `main` only after these checks passed on
    # it, so they run on `develop` first, as in chassis-website. Their results belong to the
    # commit, and the ruleset reads them there, so pushing the same commit to the other
    # branches does not run them again.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, the site's code and its types.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint site
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

  # The build's lint, type check and tests, and the package as npm publishes it, on the fixture.
  # The checks of the real files run in each repository of assets.
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts and tests
        run: pnpm assets:lint

      - name: Type check
        run: pnpm assets:typecheck

      - name: Test
        run: pnpm test

      # The package as npm publishes it: packed, installed into an empty folder with nothing
      # else, and its bin run on the fixture. Proves that `files` and `bin` of
      # packages/assets/package.json hold what a consumer needs, which the tests on the
      # checkout cannot
      - name: Pack and run the package
        run: |
          PACK="$RUNNER_TEMP/pack"
          FIXTURE="$GITHUB_WORKSPACE/packages/assets/test/fixtures"
          mkdir -p "$PACK/consumer"
          pnpm -C packages/assets pack --pack-destination "$PACK"
          cd "$PACK/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$PACK"/chassis-ui-assets-*.tgz
          test ! -e node_modules/sharp
          npx chassis-assets --version
          npx chassis-assets build --cwd "$FIXTURE" --out "$PACK/out" --quiet
          npx chassis-assets verify --cwd "$FIXTURE" --out "$PACK/out"
          npx chassis-assets archive --cwd "$FIXTURE" --out "$PACK/out" --to "$PACK/archives"

  # The asset catalogs of a build with --asset-catalog --icon-catalog, compiled with actool, the asset
  # compiler of Xcode, as chassis-tokens compiles its own. Needs no install: the build and a
  # shell script, on the small real files of the native fixture.
  native-ios:
    name: Native iOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build the native fixture with asset catalogs
        run: node packages/assets/lib/cli.js build --cwd packages/assets/test/native/fixture --platform ios --asset-catalog --icon-catalog --quiet

      # The command itself: the job sets up no pnpm
      - name: Compile the asset catalogs
        run: node packages/assets/lib/cli.js check-native --platform ios --cwd packages/assets/test/native/fixture

  # The res/ folders of a build with --res --vector-drawables, compiled and linked with aapt2,
  # the resource compiler of Android, from the Android SDK of the runner. The conversion needs
  # the install, for svg2vectordrawable.
  native-android:
    name: Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and compile the res/ folders of the native fixture
        run: pnpm test:native:android

  # The documentation site, with the assets of the archive that vendor/assets.json pins. The
  # same build as Vercel.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build

  # A change to packages/assets/lib/ or packages/assets/templates/ needs a changeset; `pnpm
  # changeset --empty` adds one that releases nothing. Changesets checks both folders
  # (changedFilePatterns in .changeset/config.json). A pull request is compared with its base
  # branch, a push to develop with the tip it replaced. The version commit consumes the
  # changesets, so a push that changes the version is skipped.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter chassis-assets-workspace

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            PACKAGE_JSON=packages/assets/package.json
            OLD_VERSION=$(git show "$BEFORE:$PACKAGE_JSON" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            NEW_VERSION=$(node -p 'require("./packages/assets/package.json").version')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "The push changes the version ($OLD_VERSION → $NEW_VERSION): a version step, which consumes changesets"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          pnpm changeset status --since="$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      # Blocking: the packages that an option of the build loads, sharp, svgo and the others,
      # optional peer dependencies installed here as devDependencies
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the test, lint and site tooling writes no file of dist/
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
