name: CI

on:
  push:
    branches: [app/docs]
  pull_request:
    branches: [app/docs]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts
        run: pnpm run assets:lint

      - name: Run build system tests
        run: pnpm run assets:test

      - name: Build all assets
        run: pnpm run assets

      - name: Validate asset distribution
        run: pnpm run assets:validate

      - name: Verify distribution
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi

          # Check that expected platforms exist
          for platform in web ios android; do
            if [ ! -d "dist/$platform" ]; then
              echo "Error: Platform $platform not found in dist"
              exit 1
            fi
          done

          echo "✅ Distribution verification passed"
