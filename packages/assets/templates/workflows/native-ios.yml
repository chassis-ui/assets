  ios:
    name: iOS
    runs-on: macos-26
    needs: build
    timeout-minutes: 20
    steps:
      # No Git LFS files: the build job made the output, and the package runs the check
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # __PNPM_SETUP__
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: __PM__

      - name: Install
        run: __INSTALL_CI__

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-build
          path: dist

      # actool, of Xcode: the runner has it
      - name: Compile
        run: npx chassis-assets check-native --platform ios
