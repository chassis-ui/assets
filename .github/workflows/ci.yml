name: CI

# release.yml reads the results of these jobs on the commit it releases, by their names.
on:
  push:
    # A commit reaches `staging`, `main` and `app/docs` only after these checks passed on
    # it, so they run on `develop` first, as in chassis-website. Their results belong to the
    # commit, and the ruleset reads them there, so pushing the same commit to the other
    # branches does not run them again.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, the site's code and its types. Needs no Git LFS files.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint site
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

  # The build's lint, source lint, type check and tests, then a full build of every brand,
  # app and platform, verified: the validator and the consumer contracts of chassis.checks.json
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fonts and images are Git LFS files. The objects are cached by the list of their ids,
      # so a run downloads only what changed, which keeps the LFS bandwidth quota low.
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # What a site does with this repository as `vendor/assets`: `chassis-docs vendor` runs
      # these two commands. The root package only is installed, the build needs none of it,
      # and the checkout stays clean. The contract check then reads the docs output.
      - name: Build as a consumer
        run: |
          pnpm install --ignore-workspace
          test ! -e packages/assets/node_modules
          pnpm assets:site
          pnpm assets:contract
          git diff --exit-code

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts and tests
        run: pnpm assets:lint

      - name: Lint source
        run: pnpm assets:lint:source

      - name: Type check
        run: pnpm assets:typecheck

      - name: Test
        run: pnpm test

      - name: Build all assets
        run: pnpm assets

      - name: Verify distribution
        run: pnpm assets:verify

  # The asset catalogs of a build with --asset-catalog, compiled with actool, the asset
  # compiler of Xcode, as chassis-tokens compiles its own. Needs no install: the build and a
  # shell script. release.yml does not wait for it, the archives are built without the option
  native-ios:
    name: Native iOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed, so there is no pnpm store to cache
          package-manager-cache: false

      - name: Build the iOS jobs with asset catalogs
        run: node packages/assets/build/cli.js build --platform ios --asset-catalog --quiet

      - name: Compile the asset catalogs
        run: packages/assets/test/native/ios/check.sh

  # The same build as Vercel: the docs assets, then Astro and Pagefind
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build

  # A change to source/ or packages/assets/build/ needs a changeset; `pnpm changeset --empty`
  # adds one that releases nothing. A pull request is compared with its base branch, a push
  # to develop with the tip it replaced. The version commit consumes the changesets, so a
  # change of the version passes. The job of the siblings runs `changeset status`, which
  # cannot see source/: it is outside the package that has the version. So this one runs a
  # script that reads Git, and needs no install.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          node build/check-changeset.js "$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      # Blocking: the packages that an option of the build loads, sharp, svgo and the others
      # of optionalDependencies, which write the files of a release archive
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the test, lint and site tooling writes no file of dist/
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
