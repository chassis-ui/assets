name: Release

# On a push to main, releases the version in package.json when it has no tag v<version> yet:
# builds every brand, app and platform, verifies the output and creates the tag and its GitHub
# release, whose body is the entry of the version in CHANGELOG.md, with the manifest and one
# archive per platform, app and brand attached:
# <name>-<platform>-<app>-<brand>-<version>.zip. A push that does not change the version
# releases nothing. Written by `chassis-assets init`.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a run that may be releasing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      # No Git LFS files: only package.json is read
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the version has a tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists: nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the tag and the GitHub release
    steps:
      # Fonts and images are Git LFS files
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      # __PNPM_SETUP__
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: __PM__

      - name: Install
        run: __INSTALL_CI__

      # Before anything else, so a version without a changelog entry is not released
      - name: Release notes
        run: npx chassis-assets release-notes > "$RUNNER_TEMP/release-notes.md"

      - name: Lint source
        run: __RUN__ lint

      - name: Build
        run: __RUN__ build:release

      - name: Verify
        run: __RUN__ verify

      # <name>-<platform>-<app>-<brand>-<version>.zip, the name and the version of package.json
      # and <name>-manifest-<version>.json, which `chassis-assets diff` reads for the next version
      - name: Archive each platform, app and brand
        run: |
          npx chassis-assets archive --to "$RUNNER_TEMP/archives"
          npx chassis-assets manifest --to "$RUNNER_TEMP/archives"

      # A version with a prerelease part, such as 0.2.0-next.0, is marked as a prerelease and
      # does not become the latest release
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) FLAGS=(--prerelease --latest=false) ;;
            *) FLAGS=(--latest) ;;
          esac

          gh release create "v$VERSION" \
            "$RUNNER_TEMP"/archives/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
