name: CI

# release.yml reads the results of these jobs on the commit it releases, by their names.
on:
  push:
    # A commit reaches `staging`, `main` and `app/docs` only after these checks passed on
    # it, so they run on `develop` first, as in chassis-website. Their results belong to the
    # commit, and the ruleset reads them there, so pushing the same commit to the other
    # branches does not run them again.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, the site's code and its types. Needs no Git LFS files.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint site
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

  # The build's lint, source lint, type check and tests, then a full build of every brand,
  # app and platform, verified: the validator and the consumer contracts of chassis.checks.json
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fonts and images are Git LFS files. The objects are cached by the list of their ids,
      # so a run downloads only what changed, which keeps the LFS bandwidth quota low.
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # What a site does with this repository as `vendor/assets`: `chassis-docs vendor` runs
      # these two commands. The root package only is installed, the build needs none of it,
      # and the checkout stays clean. The contract check then reads the docs output.
      - name: Build as a consumer
        run: |
          pnpm install --ignore-workspace
          test ! -e packages/assets/node_modules
          pnpm assets:site
          pnpm assets:contract
          git diff --exit-code

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts and tests
        run: pnpm assets:lint

      - name: Lint source
        run: pnpm assets:lint:source

      - name: Type check
        run: pnpm assets:typecheck

      - name: Test
        run: pnpm test

      - name: Build all assets
        run: pnpm assets

      - name: Verify distribution
        run: pnpm assets:verify

  # The same build as Vercel: the docs assets, then Astro and Pagefind
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build

  # A pull request that changes source/ or packages/assets/build/ adds a changeset, or is
  # the release that consumes them. Needs no install: a script that reads Git.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history up to the base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node build/check-changeset.js "origin/$BASE_REF"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      - name: Audit dependencies
        run: pnpm check:pnpm
